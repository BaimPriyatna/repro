version: 2

project_name: repro

before:
  hooks:
    - go mod tidy

builds:
  - id: repro
    main: ./cmd/repro
    binary: repro
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "repro_{{ .Os }}_{{ .Arch }}"
    # `formats` (plural) since GoReleaser v2.6; the singular `format` is
    # deprecated and `goreleaser check` fails on it.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: BaimPriyatna
    name: repro
  draft: false
  prerelease: auto
  mode: replace
